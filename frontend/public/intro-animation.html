<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>SafetyChain Intro</title>
<style>
  :root {
    --navy: #17324D;
    --charcoal: #1C1F24;
    --yellow: #E8A40A;
    --green: #2FA84F;
    --white: #F5F1E8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px;
    background: var(--charcoal); overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .stripes {
    position: absolute; left: 0; right: 0; height: 22px;
    background: repeating-linear-gradient(135deg, var(--yellow) 0 40px, var(--charcoal) 40px 80px);
  }
  .stripes.top { top: 0; }
  .stripes.bottom { bottom: 0; }

  .wordmark {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    color: var(--white); font-weight: 800; font-size: 34px; letter-spacing: 6px;
    text-transform: uppercase; opacity: 0.55;
  }
  .wordmark span { color: var(--yellow); }

  .stage { position: absolute; inset: 0; }

  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0;
    animation: cycle 12s infinite;
  }
  .scene svg { display: block; }

  .scene1 { animation-delay: 0s; }
  .scene2 { animation-delay: 4s; }
  .scene3 { animation-delay: 8s; }

  @keyframes cycle {
    0%   { opacity: 0; }
    3%   { opacity: 1; }
    30%  { opacity: 1; }
    33%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .caption {
    margin-top: 56px; color: var(--white); font-weight: 800; font-size: 40px;
    letter-spacing: 2px; text-align: center;
  }
  .caption .accent { color: var(--yellow); }
  .subcaption {
    margin-top: 14px; color: #A9B4BE; font-size: 22px; letter-spacing: 1px;
  }

  /* ---------- Scene 1: Gate + QR scan ---------- */
  .gate-wrap { position: relative; width: 460px; height: 320px; }
  .gate-post { position: absolute; top: 0; bottom: 0; width: 26px; background: var(--yellow); border-radius: 4px; }
  .gate-post.left { left: 0; }
  .gate-post.right { right: 0; }
  .gate-beam { position: absolute; top: 0; left: 0; right: 0; height: 26px; background: var(--yellow); border-radius: 4px; }

  .qr {
    position: absolute; left: 50%; top: 60%; width: 120px; height: 120px;
    transform: translate(-50%, -50%);
    background: var(--white);
    border-radius: 8px;
    animation: qrmove 4s ease-in-out infinite;
    animation-delay: inherit;
    box-shadow: 0 0 0 6px rgba(0,0,0,0);
  }
  .scene1 .qr { animation: qrmove 4s ease-in-out; animation-fill-mode: both; }
  @keyframes qrmove {
    0%   { transform: translate(-260px, 40px) scale(0.8); opacity: 0; }
    18%  { transform: translate(-30px, 40px) scale(1); opacity: 1; }
    55%  { transform: translate(-30px, 40px) scale(1); opacity: 1; }
    70%  { transform: translate(-30px, 40px) scale(1.05); }
    100% { transform: translate(-30px, 40px) scale(1.05); opacity: 1; }
  }
  .qr-grid { position: absolute; inset: 14px; display: grid; grid-template-columns: repeat(5,1fr); grid-template-rows: repeat(5,1fr); gap: 6px; }
  .qr-grid div { background: var(--charcoal); border-radius: 2px; }

  .scanbeam {
    position: absolute; left: 40px; right: 40px; top: 0; height: 6px;
    background: var(--yellow); border-radius: 3px; opacity: 0;
    box-shadow: 0 0 24px 4px var(--yellow);
  }
  .scene1 .scanbeam { animation: scan1 4s ease-in-out both; }
  @keyframes scan1 {
    0%, 55% { opacity: 0; top: 20px; }
    62% { opacity: 1; top: 20px; }
    85% { opacity: 1; top: 260px; }
    92%, 100% { opacity: 0; top: 260px; }
  }

  .check-badge {
    position: absolute; right: 20px; top: 10px; width: 84px; height: 84px; border-radius: 50%;
    background: var(--green); display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.4);
  }
  .scene1 .check-badge { animation: pop 4s ease-out both; }
  @keyframes pop {
    0%, 80% { opacity: 0; transform: scale(0.4); }
    88% { opacity: 1; transform: scale(1.15); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ---------- Scene 2: Helmet AI scan ---------- */
  .helmet-wrap { position: relative; width: 340px; height: 300px; }
  .helmet-dome {
    position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
    width: 260px; height: 150px; background: var(--white);
    border-radius: 150px 150px 20px 20px;
  }
  .helmet-brim {
    position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
    width: 320px; height: 26px; background: var(--yellow); border-radius: 14px;
  }
  .helmet-stripe {
    position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
    width: 22px; height: 150px; background: var(--yellow); opacity: 0.85;
  }
  .ai-scan {
    position: absolute; left: 20px; right: 20px; top: 30px; height: 6px;
    background: var(--yellow); border-radius: 3px; box-shadow: 0 0 24px 4px var(--yellow); opacity: 0;
  }
  .scene2 .ai-scan { animation: scan2 4s ease-in-out both; }
  @keyframes scan2 {
    0%, 12% { opacity: 0; top: 30px; }
    20% { opacity: 1; top: 30px; }
    55% { opacity: 1; top: 190px; }
    65%, 100% { opacity: 0; top: 190px; }
  }
  .scene2 .check-badge { animation: pop2 4s ease-out both; right: -10px; top: -6px; }
  @keyframes pop2 {
    0%, 68% { opacity: 0; transform: scale(0.4); }
    78% { opacity: 1; transform: scale(1.15); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ---------- Scene 3: Manager sign + on-chain ---------- */
  .doc-wrap { position: relative; width: 320px; height: 340px; }
  .doc {
    position: absolute; inset: 0; background: var(--white); border-radius: 10px;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.08);
  }
  .doc-line { position: absolute; left: 30px; right: 30px; height: 12px; background: #D9D2C2; border-radius: 6px; }
  .doc-line.l1 { top: 40px; width: 70%; }
  .doc-line.l2 { top: 70px; }
  .doc-line.l3 { top: 100px; width: 85%; }
  .sig-path {
    stroke: var(--navy); stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 300; stroke-dashoffset: 300;
  }
  .scene3 .sig-path { animation: sign 4s ease-in-out both; }
  @keyframes sign {
    0%, 25% { stroke-dashoffset: 300; }
    70% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }
  .chain-badge {
    position: absolute; right: -18px; bottom: -18px; width: 96px; height: 96px; border-radius: 50%;
    background: var(--navy); border: 5px solid var(--yellow);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.4) rotate(-20deg);
  }
  .scene3 .chain-badge { animation: pop3 4s ease-out both; }
  @keyframes pop3 {
    0%, 75% { opacity: 0; transform: scale(0.4) rotate(-20deg); }
    88% { opacity: 1; transform: scale(1.15) rotate(0deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
</style>
</head>
<body>
  <div class="stripes top"></div>
  <div class="stripes bottom"></div>
  <div class="wordmark">SAFETY<span>CHAIN</span></div>

  <div class="stage">

    <div class="scene scene1">
      <div class="gate-wrap">
        <div class="gate-beam"></div>
        <div class="gate-post left"></div>
        <div class="gate-post right"></div>
        <div class="scanbeam"></div>
        <div class="qr">
          <div class="qr-grid">
            <div style="grid-column:1/3;grid-row:1/3;background:var(--charcoal)"></div>
            <div></div>
            <div style="grid-column:4/6;grid-row:1/3;background:var(--charcoal)"></div>
            <div style="grid-column:3;grid-row:2"></div>
            <div style="grid-column:1;grid-row:3"></div>
            <div style="grid-column:3;grid-row:3;background:var(--charcoal)"></div>
            <div style="grid-column:5;grid-row:3"></div>
            <div style="grid-column:1/3;grid-row:4/6;background:var(--charcoal)"></div>
            <div style="grid-column:3;grid-row:4"></div>
            <div style="grid-column:4/6;grid-row:4/6;background:var(--charcoal)"></div>
          </div>
        </div>
        <div class="check-badge">
          <svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 13l5 5L20 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="caption">QR 스캔 <span class="accent">→</span> 게이트 통과</div>
      <div class="subcaption">1회용 nonce로 재사용을 원천 차단합니다</div>
    </div>

    <div class="scene scene2">
      <div class="helmet-wrap">
        <div class="helmet-brim"></div>
        <div class="helmet-dome"></div>
        <div class="helmet-stripe"></div>
        <div class="ai-scan"></div>
        <div class="check-badge">
          <svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 13l5 5L20 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="caption">AI 안전모 <span class="accent">판정</span></div>
      <div class="subcaption">사전학습 모델이 실시간으로 확인합니다</div>
    </div>

    <div class="scene scene3">
      <div class="doc-wrap">
        <div class="doc"></div>
        <div class="doc-line l1"></div>
        <div class="doc-line l2"></div>
        <div class="doc-line l3"></div>
        <svg width="320" height="340" style="position:absolute; inset:0;">
          <path class="sig-path" d="M 60 230 Q 90 190 120 230 T 180 230 Q 200 200 220 230 T 260 220" />
        </svg>
        <div class="chain-badge">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="8" width="9" height="9" rx="3" stroke="var(--yellow)" stroke-width="2.4"/>
            <rect x="13" y="8" width="9" height="9" rx="3" stroke="var(--yellow)" stroke-width="2.4"/>
          </svg>
        </div>
      </div>
      <div class="caption">관리자 서명 <span class="accent">→</span> 온체인 기록</div>
      <div class="subcaption">서명 이후 아무도 고칠 수 없습니다</div>
    </div>

  </div>
</body>
</html>
